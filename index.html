<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#dashboard">Taskboard</a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <a href="#dashboard">Dashboard</a>
        <a href="#add-task">Add task</a>
        <a href="#tasks">Tasks</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="dashboard" aria-labelledby="dash-title">
      <h1 id="dash-title">Dashboard</h1>
      <div class="summary">
        <article class="card stat">
          <p class="stat-label">Total tasks</p>
          <p class="stat-value" id="count-total">0</p>
        </article>
        <article class="card stat stat-done">
          <p class="stat-label">Completed</p>
          <p class="stat-value" id="count-completed">0</p>
        </article>
        <article class="card stat stat-pending">
          <p class="stat-label">Pending</p>
          <p class="stat-value" id="count-pending">0</p>
        </article>
      </div>
    </section>

    <div class="layout">
      <section id="add-task" class="card form-card" aria-labelledby="form-title">
        <h2 id="form-title">Add a task</h2>
        <p id="success-msg" class="success" role="status" hidden></p>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" maxlength="100" autocomplete="off" aria-describedby="title-error" />
            <p class="error" id="title-error"></p>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" aria-describedby="description-error"></textarea>
            <p class="error" id="description-error"></p>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="priority">Priority</label>
              <select id="priority" name="priority" aria-describedby="priority-error">
                <option value="">Choose priority</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
              <p class="error" id="priority-error"></p>
            </div>
            <div class="field">
              <label for="dueDate">Due date</label>
              <input id="dueDate" name="dueDate" type="date" aria-describedby="dueDate-error" />
              <p class="error" id="dueDate-error"></p>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add task</button>
            <button type="button" id="cancel-btn" class="btn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section id="tasks" aria-labelledby="tasks-title">
        <h2 id="tasks-title">Tasks</h2>
        <div class="toolbar">
          <div class="field search-field">
            <label for="search">Search by title</label>
            <input id="search" type="search" placeholder="Search tasks" autocomplete="off" />
          </div>
          <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="newest">Newest first</option>
              <option value="dueDate">Due date</option>
              <option value="priority">Priority</option>
              <option value="title">Title (A–Z)</option>
            </select>
          </div>
        </div>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="chip active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-filter="pending" aria-pressed="false">Pending</button>
          <button type="button" class="chip" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <div id="empty-state" class="empty" hidden>
          <p id="empty-text">No tasks yet.</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer container">
    <p>Day 5 mini-project · Built with HTML, CSS and TypeScript</p>
  </footer>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
